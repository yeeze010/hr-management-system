<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: "Microsoft YaHei", Arial, sans-serif; }
    .bg { fill: #0f172a; }
    .grid { stroke: #1e293b; stroke-width: .5; }
    .title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 10px; }
    .box { rx: 8; stroke-width: 1.5; }
    .front { fill: rgba(8,51,68,.45); stroke: #22d3ee; }
    .back { fill: rgba(6,78,59,.45); stroke: #34d399; }
    .data { fill: rgba(76,29,149,.45); stroke: #a78bfa; }
    .ops { fill: rgba(120,53,15,.35); stroke: #fbbf24; }
    .label { fill: white; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .small { fill: #cbd5e1; font-size: 9px; text-anchor: middle; }
    .line { fill: none; stroke: #64748b; stroke-width: 1.4; marker-end: url(#arrow); }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="560" class="bg"/>
  <rect width="960" height="560" fill="url(#grid)"/>
  <text x="30" y="40" class="title">人事全流程与组织效能管理系统架构图</text>
  <text x="30" y="60" class="sub">Vue 3 / NestJS / PostgreSQL / Redis / MinIO / Docker + Nginx</text>
  <rect x="50" y="130" width="150" height="62" class="box front"/>
  <text x="125" y="156" class="label">HR 管理后台</text>
  <text x="125" y="174" class="small">Vue 3 + TypeScript</text>
  <rect x="50" y="250" width="150" height="62" class="box front"/>
  <text x="125" y="276" class="label">员工自助</text>
  <text x="125" y="294" class="small">移动端审批/查询</text>
  <rect x="290" y="190" width="150" height="62" class="box ops"/>
  <text x="365" y="216" class="label">Nginx</text>
  <text x="365" y="234" class="small">静态资源/反向代理</text>
  <rect x="530" y="80" width="150" height="58" class="box back"/>
  <text x="605" y="105" class="label">认证权限</text>
  <text x="605" y="123" class="small">RBAC/数据范围</text>
  <rect x="530" y="160" width="150" height="58" class="box back"/>
  <text x="605" y="185" class="label">员工档案</text>
  <text x="605" y="203" class="small">合同/证书/经历</text>
  <rect x="530" y="240" width="150" height="58" class="box back"/>
  <text x="605" y="265" class="label">流程审批</text>
  <text x="605" y="283" class="small">入转调离/请假</text>
  <rect x="530" y="320" width="150" height="58" class="box back"/>
  <text x="605" y="345" class="label">绩效培训</text>
  <text x="605" y="363" class="small">周期/课程/记录</text>
  <rect x="530" y="400" width="150" height="58" class="box back"/>
  <text x="605" y="425" class="label">报表审计</text>
  <text x="605" y="443" class="small">导出/日志/告警</text>
  <rect x="760" y="130" width="140" height="58" class="box data"/>
  <text x="830" y="155" class="label">PostgreSQL</text>
  <text x="830" y="173" class="small">业务主库</text>
  <rect x="760" y="250" width="140" height="58" class="box data"/>
  <text x="830" y="275" class="label">Redis</text>
  <text x="830" y="293" class="small">缓存/锁/队列</text>
  <rect x="760" y="370" width="140" height="58" class="box data"/>
  <text x="830" y="395" class="label">MinIO</text>
  <text x="830" y="413" class="small">合同/附件/报表</text>
  <path d="M200 161 L290 221" class="line"/>
  <path d="M200 281 L290 221" class="line"/>
  <path d="M440 221 L530 109" class="line"/>
  <path d="M440 221 L530 189" class="line"/>
  <path d="M440 221 L530 269" class="line"/>
  <path d="M440 221 L530 349" class="line"/>
  <path d="M440 221 L530 429" class="line"/>
  <path d="M680 189 L760 159" class="line"/>
  <path d="M680 269 L760 279" class="line"/>
  <path d="M680 429 L760 399" class="line"/>
</svg>
