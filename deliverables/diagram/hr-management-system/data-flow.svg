<svg viewBox="0 0 1120 760" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif; }
    .title{fill:#f8fafc;font-size:18px;font-weight:700}.subt{fill:#94a3b8;font-size:10px}
    .entity{fill:rgba(30,41,59,.55);stroke:#94a3b8;stroke-width:1.5}.process{fill:rgba(8,51,68,.43);stroke:#22d3ee;stroke-width:1.5}
    .store{fill:rgba(76,29,149,.42);stroke:#a78bfa;stroke-width:1.5}.audit{fill:rgba(136,19,55,.38);stroke:#fb7185;stroke-width:1.5}
    .label{fill:#fff;font-size:12px;font-weight:600;text-anchor:middle}.small{fill:#94a3b8;font-size:9px;text-anchor:middle}
    .line{fill:none;stroke:#64748b;stroke-width:1.35;marker-end:url(#arrow)}.data{fill:none;stroke:#22d3ee;stroke-width:1.5;marker-end:url(#arrow-cyan)}
    .event{fill:none;stroke:#fb923c;stroke-width:1.4;stroke-dasharray:6 4;marker-end:url(#arrow-orange)}.secure{fill:none;stroke:#fb7185;stroke-width:1.35;marker-end:url(#arrow-red)}
    .tiny{fill:#cbd5e1;font-size:8px;text-anchor:middle}
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb923c"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb7185"/></marker>
  </defs>
  <rect width="1120" height="760" fill="#0f172a"/>
  <rect width="1120" height="760" fill="url(#grid)"/>
  <text x="30" y="38" class="title">人事全流程与组织效能管理系统 - 数据流图</text>
  <text x="30" y="58" class="subt">员工主数据、审批单据、附件、薪资与审计数据在系统内的主要流向</text>

  <rect x="50" y="140" width="145" height="58" rx="8" class="entity"/><text x="122.5" y="164" class="label">员工</text><text x="122.5" y="181" class="small">自助申请 / 查询</text>
  <rect x="50" y="270" width="145" height="58" rx="8" class="entity"/><text x="122.5" y="294" class="label">HR 专员</text><text x="122.5" y="311" class="small">档案 / 合同 / 薪资</text>
  <rect x="50" y="400" width="145" height="58" rx="8" class="entity"/><text x="122.5" y="424" class="label">部门主管</text><text x="122.5" y="441" class="small">审批 / 绩效评价</text>

  <rect x="300" y="115" width="170" height="62" rx="8" class="process"/><text x="385" y="141" class="label">表单与校验层</text><text x="385" y="158" class="small">字段规则 / 权限过滤</text>
  <rect x="300" y="240" width="170" height="62" rx="8" class="process"/><text x="385" y="266" class="label">业务服务层</text><text x="385" y="283" class="small">员工 / 假勤 / 薪酬 / 招聘</text>
  <rect x="300" y="365" width="170" height="62" rx="8" class="process"/><text x="385" y="391" class="label">审批工作流</text><text x="385" y="408" class="small">节点 / 条件 / 待办</text>
  <rect x="300" y="490" width="170" height="62" rx="8" class="process"/><text x="385" y="516" class="label">报表导出层</text><text x="385" y="533" class="small">统计 / Excel / 权限水印</text>

  <g transform="translate(620 105)">
    <rect x="0" y="12" width="145" height="62" fill="#0f172a"/>
    <ellipse cx="72.5" cy="12" rx="72.5" ry="13" fill="#0f172a"/>
    <ellipse cx="72.5" cy="74" rx="72.5" ry="13" fill="#0f172a"/>
    <rect x="0" y="12" width="145" height="62" class="store"/>
    <ellipse cx="72.5" cy="12" rx="72.5" ry="13" class="store"/>
    <ellipse cx="72.5" cy="74" rx="72.5" ry="13" class="store"/>
    <line x1="0" y1="12" x2="0" y2="74" stroke="#a78bfa" stroke-width="1.5"/><line x1="145" y1="12" x2="145" y2="74" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="72.5" y="39" class="label">主数据库</text><text x="72.5" y="56" class="small">PostgreSQL</text>
  </g>
  <rect x="620" y="250" width="145" height="62" rx="8" class="store"/><text x="692.5" y="276" class="label">Redis</text><text x="692.5" y="293" class="small">缓存 / 锁 / 队列</text>
  <rect x="620" y="390" width="145" height="62" rx="8" class="store"/><text x="692.5" y="416" class="label">MinIO</text><text x="692.5" y="433" class="small">附件 / 模板 / 导入文件</text>
  <rect x="620" y="530" width="145" height="62" rx="8" class="audit"/><text x="692.5" y="556" class="label">审计日志</text><text x="692.5" y="573" class="small">操作 / 审批 / 导出记录</text>

  <rect x="895" y="160" width="155" height="58" rx="8" class="entity"/><text x="972.5" y="184" class="label">消息渠道</text><text x="972.5" y="201" class="small">邮件 / 企业微信</text>
  <rect x="895" y="315" width="155" height="58" rx="8" class="entity"/><text x="972.5" y="339" class="label">财务系统</text><text x="972.5" y="356" class="small">薪资汇总 / 成本中心</text>
  <rect x="895" y="470" width="155" height="58" rx="8" class="entity"/><text x="972.5" y="494" class="label">管理员</text><text x="972.5" y="511" class="small">角色 / 字典 / 流程配置</text>

  <path d="M195 169 L300 146" class="data"/><text x="250" y="145" class="tiny">申请表单</text>
  <path d="M195 299 L300 271" class="data"/><text x="250" y="270" class="tiny">员工档案</text>
  <path d="M195 429 L300 396" class="data"/><text x="250" y="397" class="tiny">审批意见</text>
  <path d="M385 177 L385 240" class="line"/>
  <path d="M470 271 L620 148" class="data"/><text x="548" y="195" class="tiny">业务数据</text>
  <path d="M470 271 L620 281" class="data"/><text x="546" y="266" class="tiny">热点缓存</text>
  <path d="M470 271 L620 421" class="data"/><text x="548" y="344" class="tiny">附件索引</text>
  <path d="M470 396 L620 281" class="event"/><text x="546" y="324" class="tiny">待办事件</text>
  <path d="M470 396 L620 561" class="secure"/><text x="545" y="492" class="tiny">审批留痕</text>
  <path d="M470 521 L620 148" class="data"/><text x="525" y="464" class="tiny">报表查询</text>
  <path d="M470 521 L620 561" class="secure"/><text x="543" y="555" class="tiny">导出审计</text>
  <path d="M765 281 L895 189" class="event"/><text x="825" y="220" class="tiny">通知消息</text>
  <path d="M765 148 L895 344" class="data"/><text x="821" y="256" class="tiny">薪资摘要</text>
  <path d="M895 499 L765 561" class="secure"/><text x="828" y="548" class="tiny">配置变更</text>
  <path d="M620 421 L470 146" class="data" opacity=".8"/><text x="530" y="120" class="tiny">附件回显</text>
</svg>
