<svg viewBox="0 0 980 1040" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { fill:#f8fafc; font-size:18px; font-weight:700; }
    .subt { fill:#94a3b8; font-size:10px; }
    .node { fill:rgba(8,51,68,.45); stroke:#22d3ee; stroke-width:1.5; }
    .step { fill:rgba(6,78,59,.42); stroke:#34d399; stroke-width:1.5; }
    .decision { fill:rgba(120,53,15,.35); stroke:#fbbf24; stroke-width:1.5; }
    .alert { fill:rgba(136,19,55,.42); stroke:#fb7185; stroke-width:1.5; }
    .end { fill:rgba(59,130,246,.35); stroke:#60a5fa; stroke-width:1.5; }
    .label { fill:#fff; font-size:12px; font-weight:600; text-anchor:middle; }
    .small { fill:#94a3b8; font-size:9px; text-anchor:middle; }
    .tiny { fill:#cbd5e1; font-size:8px; }
    .line { fill:none; stroke:#64748b; stroke-width:1.4; marker-end:url(#arrow); }
    .yes { fill:none; stroke:#34d399; stroke-width:1.5; marker-end:url(#arrow-green); }
    .no { fill:none; stroke:#fb7185; stroke-width:1.4; stroke-dasharray:5 4; marker-end:url(#arrow-red); }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#34d399"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb7185"/></marker>
  </defs>
  <rect width="980" height="1040" fill="#0f172a"/>
  <rect width="980" height="1040" fill="url(#grid)"/>
  <text x="30" y="38" class="title">HR Management System - 人事业务主流程</text>
  <text x="30" y="58" class="subt">覆盖招聘、入职、在职管理、考勤假勤、薪酬绩效、异动与离职验收链路</text>

  <rect x="390" y="90" width="200" height="58" rx="25" class="end"/>
  <text x="490" y="116" class="label">业务发起</text>
  <text x="490" y="133" class="small">招聘需求 / 员工变更 / 请假申请</text>
  <rect x="390" y="205" width="200" height="62" rx="8" class="step"/>
  <text x="490" y="232" class="label">录入或导入基础数据</text>
  <text x="490" y="249" class="small">组织、岗位、员工、合同、附件</text>
  <g transform="translate(490 340)">
    <polygon points="0,-42 72,0 0,42 -72,0" class="decision"/>
    <text y="-4" class="label">是否需要审批?</text>
    <text y="13" class="small">按流程配置判断</text>
  </g>
  <rect x="690" y="310" width="190" height="62" rx="8" class="step"/>
  <text x="785" y="337" class="label">审批流转</text>
  <text x="785" y="354" class="small">直属主管 / HR / 财务 / 总经理</text>
  <g transform="translate(785 455)">
    <polygon points="0,-42 72,0 0,42 -72,0" class="decision"/>
    <text y="-4" class="label">审批通过?</text>
    <text y="13" class="small">通过 / 驳回 / 撤回</text>
  </g>
  <rect x="690" y="570" width="190" height="62" rx="8" class="alert"/>
  <text x="785" y="597" class="label">退回修改</text>
  <text x="785" y="614" class="small">补充材料或修改表单</text>

  <rect x="390" y="455" width="200" height="62" rx="8" class="step"/>
  <text x="490" y="482" class="label">生效业务单据</text>
  <text x="490" y="499" class="small">入职 / 转正 / 调岗 / 请假 / 离职</text>
  <rect x="390" y="590" width="200" height="62" rx="8" class="step"/>
  <text x="490" y="617" class="label">更新员工主数据</text>
  <text x="490" y="634" class="small">档案、岗位、状态、合同、薪资项</text>
  <rect x="390" y="725" width="200" height="62" rx="8" class="step"/>
  <text x="490" y="752" class="label">触发关联任务</text>
  <text x="490" y="769" class="small">通知、待办、薪酬、报表、审计</text>
  <rect x="390" y="860" width="200" height="58" rx="25" class="end"/>
  <text x="490" y="886" class="label">流程归档</text>
  <text x="490" y="903" class="small">可查询、可追溯、可导出</text>

  <rect x="90" y="455" width="190" height="62" rx="8" class="node"/>
  <text x="185" y="482" class="label">自助查询</text>
  <text x="185" y="499" class="small">员工查看假勤、薪资、合同</text>
  <rect x="90" y="590" width="190" height="62" rx="8" class="node"/>
  <text x="185" y="617" class="label">异常处理</text>
  <text x="185" y="634" class="small">缺卡、补卡、合同到期提醒</text>

  <path d="M490 148 L490 205" class="line"/>
  <path d="M490 267 L490 298" class="line"/>
  <path d="M562 340 L690 340" class="yes"/>
  <text x="606" y="329" fill="#34d399" font-size="9">是</text>
  <path d="M490 382 L490 455" class="yes"/>
  <text x="505" y="421" fill="#34d399" font-size="9">否</text>
  <path d="M785 372 L785 413" class="line"/>
  <path d="M713 455 L590 486" class="yes"/>
  <text x="650" y="462" fill="#34d399" font-size="9">通过</text>
  <path d="M785 497 L785 570" class="no"/>
  <text x="800" y="535" fill="#fb7185" font-size="9">驳回</text>
  <path d="M690 601 L630 601 L630 236 L590 236" class="no"/>
  <path d="M490 517 L490 590" class="line"/>
  <path d="M490 652 L490 725" class="line"/>
  <path d="M490 787 L490 860" class="line"/>
  <path d="M390 486 L280 486" class="line"/>
  <path d="M390 621 L280 621" class="line"/>
  <path d="M185 517 L185 590" class="line"/>

  <rect x="650" y="880" width="250" height="76" rx="8" fill="rgba(30,41,59,.7)" stroke="#475569"/>
  <text x="672" y="904" class="tiny">验收关注点</text>
  <text x="672" y="924" class="tiny">1. 所有审批节点留痕</text>
  <text x="672" y="942" class="tiny">2. 主数据变更可回溯</text>
  <text x="672" y="960" class="tiny">3. 待办、通知、报表一致</text>
</svg>
