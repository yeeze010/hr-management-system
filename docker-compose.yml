services:
  postgres:
    image: postgres:16-alpine
    container_name: hr-postgres
    environment:
      POSTGRES_DB: hr_management
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_user -d hr_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: hr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hrminio
      MINIO_ROOT_PASSWORD: hrminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: hr-backend
    environment:
      API_PORT: 8216
      PORT: 8216
      FRONTEND_ORIGIN: http://localhost:5216
      DATABASE_URL: postgresql://hr_user:hr_password@postgres:5432/hr_management
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: hrminio
      MINIO_SECRET_KEY: hrminio123
    ports:
      - "8216:8216"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: hr-frontend
    ports:
      - "5216:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  minio-data:
